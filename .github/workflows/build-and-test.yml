name: Build and test

#on:
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]
on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
        
        - name: making build directory
          run: mkdir build
            
        - name: cmake configure
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DANSI_SGR2HTML_BUILD_TESTS=ON
        
        - name: cmake build
          run: cmake --build build --config Release

        - name: cmake build tests
          run: cmake --build build --config Release --target tests

        - name: cmake test
          run: ctest --test-dir build --output-on-failure -V
